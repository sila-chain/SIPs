name: Finalize Sila-native CI Authority

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f
        with:
          fetch-depth: 0
          ref: main

      - name: Pin final Sila-native generator and identity gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/ci.yml')
          s = p.read_text()

          old_generator = "GENERATOR_COMMIT='5935cf44ebe7853445958279c65f308f2739ad6a'"
          new_generator = "GENERATOR_COMMIT='b9c063e02ee8d88d320513a57b5c7420584527a2'"
          if old_generator not in s:
              raise SystemExit('OLD_GENERATOR_PIN_NOT_FOUND')
          s = s.replace(old_generator, new_generator, 1)

          pattern = re.compile(
              r"          post_regeneration_override_blobs = \{\n.*?"
              r"          \}\n          post_regeneration_overrides = set\(post_regeneration_override_blobs\)",
              re.S,
          )
          replacement = """          post_regeneration_override_blobs = {
              '_config.yml': 'ac0afcd45ca4aded880223e8c7c75327147a7c53',
          }
          post_regeneration_overrides = set(post_regeneration_override_blobs)"""
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'OVERRIDE_POLICY_REPLACEMENT_COUNT={n}')

          marker = '      - name: Prepare Sila-owned Markdown override projection\n'
          i = s.find(marker)
          if i < 0:
              raise SystemExit('MARKDOWN_MEGA_SYNC_MARKER_NOT_FOUND')

          tail = r'''      - name: Prepare Sila-native Markdown identity audit projection
        if: env.MEGA_SYNC == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = []
          for root in (Path('SIPS'), Path('assets')):
              if root.exists():
                  files.extend(p for p in root.rglob('*.md') if p.is_file())
          for p in (Path('README.md'), Path('CONTRIBUTING.md')):
              if p.is_file():
                  files.append(p)

          url_re = re.compile(r'https?://[^\s\)\]\}\>\"\']+')
          protected = [
              re.compile(r'go-ethereum', re.IGNORECASE),
              re.compile(r'openethereum-evm', re.IGNORECASE),
              re.compile(r'Py-EVM', re.IGNORECASE),
              re.compile(r'web\+evm', re.IGNORECASE),
              re.compile(r'\bevmone\b', re.IGNORECASE),
              re.compile(r'\bEVMC\b'),
              re.compile(r'\bEVM[0-9]+\b'),
              re.compile(r'gasEVM[A-Za-z0-9_]*'),
              re.compile(r'\beth_[A-Za-z0-9_]+\b'),
              re.compile(r'\beth2spec\b', re.IGNORECASE),
              re.compile(r'\beth2\.0-specs\b', re.IGNORECASE),
          ]

          research = []
          evm = []
          identity = []
          for p in sorted(set(files)):
              text = p.read_text(encoding='utf-8')
              rel = p.as_posix()
              if 'ethresear.ch/' in text:
                  research.append(rel)
              scrubbed = url_re.sub('', text)
              for rx in protected:
                  scrubbed = rx.sub('', scrubbed)
              if re.search(r'(?<![A-Za-z0-9_])(?:EVM|Evm|evm)(?![A-Za-z0-9_])', scrubbed):
                  evm.append(rel)
              if re.search(r'(?<![A-Za-z0-9_])(?:Ethereum|ethereum|ETHEREUM)(?![A-Za-z0-9_])', scrubbed):
                  identity.append(rel + ':Ethereum')
              if re.search(r'(?<![A-Za-z0-9_])(?:EIP|eip|ERC|erc)(?![A-Za-z0-9_])', scrubbed):
                  identity.append(rel + ':EIP_ERC')

          sip712 = Path('SIPS/sip-712.md').read_text(encoding='utf-8')
          if '\\x19Ethereum Signed Message:' in sip712:
              identity.append('SIPS/sip-712.md:OLD_SIGNATURE_DOMAIN')
          if '\\x19Sila Signed Message:' not in sip712:
              identity.append('SIPS/sip-712.md:MISSING_SILA_SIGNATURE_DOMAIN')

          required_paths = [
              Path('assets/sip-3267/contracts/SRC1155/ISRC1155.sol'),
              Path('assets/sip-3267/contracts/SRC1155/ISRC1155TokenReceiver.sol'),
              Path('assets/sip-7543/gasEVMPlusEmulate.go'),
              Path('assets/sip-7979/riscv/evm64.py'),
              Path('assets/sip-8051/mldsa_evm.rsp'),
          ]
          forbidden_paths = [
              Path('assets/sip-3267/contracts/SRC1155/IERC1155.sol'),
              Path('assets/sip-3267/contracts/SRC1155/IERC1155TokenReceiver.sol'),
              Path('assets/sip-7543/gasSVMPlusEmulate.go'),
              Path('assets/sip-7979/riscv/svm64.py'),
              Path('assets/sip-8051/mldsa_svm.rsp'),
          ]
          path_failures = [f'MISSING:{p}' for p in required_paths if not p.is_file()]
          path_failures += [f'FORBIDDEN:{p}' for p in forbidden_paths if p.exists()]

          print(f'SILA_NATIVE_RESEARCH_RESIDUAL_COUNT={len(research)}')
          print(f'SILA_NATIVE_EVM_IDENTITY_RESIDUAL_COUNT={len(evm)}')
          print(f'SILA_NATIVE_OTHER_IDENTITY_RESIDUAL_COUNT={len(identity)}')
          print(f'SILA_NATIVE_PATH_FAILURE_COUNT={len(path_failures)}')
          failures = research + evm + identity + path_failures
          if failures:
              for item in failures:
                  print(f'SILA_NATIVE_IDENTITY_FAILURE:{item}')
              raise SystemExit(1)

          Path('.sila-owned-identity-audit.md').write_text(
              '# Sila-native identity audit\n\n'
              '- Sila protocol identity: validated\n'
              '- SVM identity conversion: validated\n'
              '- Historical non-Sila research references: absent\n'
              '- Required external technical identifiers: preserved\n'
              '- Sila contract interface paths: validated\n'
          )
          print('SILA_NATIVE_IDENTITY_GATE=PASS')
          PY

      - name: Lint Sila-native identity audit projection for source mega-sync
        uses: DavidAnson/markdownlint-cli2-action@f5cf187ef11bd3a68a127321b794aa252ff23019
        if: env.MEGA_SYNC == 'true'
        with:
          command: config
          globs: |
            config/.markdownlint.yaml
            .sila-owned-identity-audit.md
'''
          s = s[:i] + tail
          p.write_text(s)
          PY

      - name: Validate workflow syntax and authority pins
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ci.yml'); puts 'CI_YAML_GATE=PASS'"
          grep -Fq "GENERATOR_COMMIT='b9c063e02ee8d88d320513a57b5c7420584527a2'" .github/workflows/ci.yml
          ! grep -Fq "GENERATOR_COMMIT='5935cf44ebe7853445958279c65f308f2739ad6a'" .github/workflows/ci.yml
          echo 'FINAL_CI_AUTHORITY_GATE=PASS'

      - name: Commit CI authority and remove temporary workflow
        shell: bash
        env:
          BRANCH: main
        run: |
          set -euo pipefail
          rm -f .github/workflows/sila-ci-v3-authority-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'ci: validate final Sila-native regeneration authority'
          git push origin "HEAD:$BRANCH"
