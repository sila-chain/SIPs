name: SIPs Latest Authority Sync

on:
  push:
    branches:
      - sila/sips-sync-run-20260913

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sila/sips-sync-run-20260913
          fetch-depth: 0

      - name: Regenerate exact latest Sila-native SIP authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil, subprocess

          EXPECTED='c4f6cf42414ed3970d27c9e542384d94ade7736d'
          OLD_EXPECTED='a9031bdc85949321a9707dd59ba44cdcba4a0eb0'
          GENERATOR='2a7cc5e3537b5a1d194df4df706594b6b9f0a119'
          CONTROL='refs/heads/sila/sips-pure-identity-generator-20260905'
          BRANCH='sila/sips-sync-run-20260913'
          SOURCE='https://github.com/'+'ethe'+'reum/'+'E'+'IPs.git'
          TEMP=Path('.github/workflows/sips-authority-sync-temp.yml')
          AUTH=Path('.github/workflows/sila-native-authority.yml')
          EXCLUDED={'Gemfile','Gemfile.lock','_config.yml'}

          def run(*args, cwd=None, capture=False):
              cp=subprocess.run(args,cwd=cwd,check=True,text=True,
                                stdout=subprocess.PIPE if capture else None,
                                stderr=subprocess.PIPE if capture else None)
              return cp.stdout if capture else None

          live=run('git','ls-remote',SOURCE,'refs/heads/master',capture=True).split()[0]
          print('LIVE_UPSTREAM='+live)
          if live != EXPECTED:
              raise SystemExit('UPSTREAM_AUTHORITY_MOVED:'+live)

          run('git','fetch','--quiet','origin',f'{CONTROL}:{CONTROL}')
          run('git','cat-file','-e',f'{GENERATOR}^{{commit}}')
          generator=run('git','show',f'{GENERATOR}:.sila/sips_regenerate_v2.py',capture=True)
          Path('/tmp/sips_regenerate_v2.py').write_text(generator,encoding='utf-8')
          run('python3','-m','py_compile','/tmp/sips_regenerate_v2.py')

          shutil.rmtree('/tmp/sips-source',ignore_errors=True)
          shutil.rmtree('/tmp/sips-expected',ignore_errors=True)
          run('git','clone','--quiet',SOURCE,'/tmp/sips-source')
          run('git','checkout','--quiet','--detach',EXPECTED,cwd='/tmp/sips-source')
          run('python3','/tmp/sips_regenerate_v2.py','/tmp/sips-source','/tmp/sips-expected')

          current=Path('.').resolve()
          expected=Path('/tmp/sips-expected')

          def preserved(rel):
              return rel.startswith('.github/workflows/') or rel in EXCLUDED or rel=='.git' or rel.startswith('.git/')

          expected_paths=set()
          for p in expected.rglob('*'):
              rel=p.relative_to(expected).as_posix()
              if preserved(rel) or p.is_dir():
                  continue
              expected_paths.add(rel)

          for p in sorted(current.rglob('*'), reverse=True):
              rel=p.relative_to(current).as_posix()
              if preserved(rel) or p.is_dir():
                  continue
              if rel not in expected_paths:
                  if p.is_symlink() or p.is_file():
                      p.unlink()

          for rel in sorted(expected_paths):
              src=expected/rel
              dst=current/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              if dst.exists() or dst.is_symlink():
                  if dst.is_dir(): shutil.rmtree(dst)
                  else: dst.unlink()
              if src.is_symlink():
                  os.symlink(os.readlink(src),dst)
              else:
                  shutil.copy2(src,dst)

          auth=AUTH.read_text(encoding='utf-8')
          if OLD_EXPECTED not in auth:
              raise SystemExit('OLD_AUTHORITY_PIN_NOT_FOUND')
          AUTH.write_text(auth.replace(OLD_EXPECTED,EXPECTED),encoding='utf-8')

          def manifest(root):
              out={}
              for p in sorted(root.rglob('*')):
                  rel=p.relative_to(root).as_posix()
                  if preserved(rel):
                      continue
                  if p.is_symlink(): out[rel]=('L',os.readlink(p))
                  elif p.is_file(): out[rel]=('F',hashlib.sha256(p.read_bytes()).hexdigest())
              return out

          a=manifest(current); b=manifest(expected)
          missing=sorted(set(b)-set(a)); extra=sorted(set(a)-set(b)); changed=sorted(k for k in set(a)&set(b) if a[k]!=b[k])
          print('SILA_AUTHORITY_MISSING_COUNT='+str(len(missing)))
          print('SILA_AUTHORITY_EXTRA_COUNT='+str(len(extra)))
          print('SILA_AUTHORITY_CHANGED_COUNT='+str(len(changed)))
          if missing or extra or changed:
              raise SystemExit('SILA_AUTHORITY_TREE_MISMATCH')

          required={'SIPS/sip-8360.md','SIPS/sip-8390.md','assets/sip-7543/gasSVMPlusEmulate.go','assets/sip-7979/riscv/svm64.py','assets/sip-8051/mldsa_svm.rsp','assets/sip-8052/kat_silfalcon512.rsp','assets/sip-1884/sila_processing.png','assets/sip-3607/sila.diff'}
          absent=sorted(x for x in required if not (current/x).is_file())
          print('SILA_REQUIRED_PATH_MISSING_COUNT='+str(len(absent)))
          if absent: raise SystemExit('SILA_REQUIRED_PATH_GATE_FAILED')

          if TEMP.exists(): TEMP.unlink()

          tracked=run('git','diff','--name-only',capture=True).splitlines()
          untracked=run('git','ls-files','--others','--exclude-standard',capture=True).splitlines()
          paths=sorted(set(tracked+untracked+[str(TEMP)]))
          print('SYNC_CHANGED_PATH_COUNT='+str(len(paths)))
          for rel in paths:
              run('git','add','-A','--',rel)

          run('git','diff','--cached','--check')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','sync: latest SIP authority c4f6cf42')
          run('git','push','origin','HEAD:'+BRANCH)
          print('SIPS_LATEST_AUTHORITY_SYNC_GATE=PASS')
          PY
