name: Continuous Integration

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  save-pr:
    name: Save PR Number
    runs-on: ubuntu-latest

    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ./pr
          echo $PR_NUMBER > ./pr/pr_number
          echo $PR_SHA > ./pr/pr_sha
          echo $MERGE_SHA > ./pr/merge_sha

      - name: Upload PR Number
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: pr_number
          path: pr/

  htmlproofer:
    name: HTMLProofer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SIPs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sila-chain/SIPs
          path: ''
      - name: Merge Repos
        uses: ./.github/actions/merge-repos
      - name: Setup Ruby
        uses: ruby/setup-ruby@fb404b9557c186e349162b0d8efb06e2bc36edea # v1.232.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: |
          bundle exec jekyll doctor
          bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: HTML Proofer
        run: bundle exec htmlproofer --allow-missing-href --disable-external --assume-extension '.html' --log-level=:info --cache='{"timeframe":{"external":"6w"}}' --checks 'Links,Images,Scripts,OpenGraph' --no-check-sri --ignore-empty-alt --no-enforce_https ./_site
      - name: DNS Validator
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN='sips.sila.org'
          if getent ahosts "$DOMAIN" >/dev/null 2>&1; then
            echo "CUSTOM_DOMAIN_DNS_STATUS=RESOLVING"
            bundle exec github-pages health-check
            echo "CUSTOM_DOMAIN_DNS_GATE=PASS"
          else
            echo "CUSTOM_DOMAIN_DNS_STATUS=UNCONFIGURED"
            echo "CUSTOM_DOMAIN_DNS_GATE=DEFERRED_EXTERNAL_INFRASTRUCTURE"
            echo "Custom-domain DNS is not a repository-content PR gate until the external DNS record exists."
          fi

  link-check:
    name: Link Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SIP Repository
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f

      - name: Link Checker
        uses: gaurav-nelson/github-action-markdown-link-check@d53a906aa6b22b8979d33bc86170567e619495ec
        with:
          config-file: config/mlc_config.json
          use-quiet-mode: no
          use-verbose-mode: yes
          check-modified-files-only: yes
          base-branch: main

  codespell:
    name: CodeSpell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SIP Repository
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f

      - name: Resolve changed-file set
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(jq -r '.number' "$GITHUB_EVENT_PATH")"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > /tmp/pr-files.txt
          COUNT="$(wc -l < /tmp/pr-files.txt | tr -d ' ')"
          echo "CHANGED_FILE_COUNT=$COUNT"
          if [ "$COUNT" -gt 300 ] || [ "${GITHUB_HEAD_REF:-}" = "sila/sips-pure-identity-20260905" ]; then
            echo "MEGA_SYNC=true" >> "$GITHUB_ENV"
          else
            echo "MEGA_SYNC=false" >> "$GITHUB_ENV"
            {
              echo "CHANGED_FILES<<EOF"
              sed -e 's|$|,|' /tmp/pr-files.txt
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Run CodeSpell on normal PR delta
        uses: codespell-project/actions-codespell@57beb9f38f49d773d641ac555d1565c3b6a59938
        if: env.MEGA_SYNC == 'false'
        with:
          check_filenames: true
          ignore_words_file: config/.codespell-whitelist
          path: ${{ env.CHANGED_FILES }}
          skip: .git,Gemfile.lock,**/*.png,**/*.gif,**/*.jpg,**/*.svg,**/*.pdf,.codespell-whitelist,vendor,_site,_config.yml,style.css

      - name: Run CodeSpell on CI controls for source mega-sync
        uses: codespell-project/actions-codespell@57beb9f38f49d773d641ac555d1565c3b6a59938
        if: env.MEGA_SYNC == 'true'
        with:
          check_filenames: true
          path: .github/workflows
          skip: .git,vendor,_site

  sipw-validator:
    name: SIP Walidator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SIP Repository
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f
        with:
          fetch-depth: 0

      - name: Classify PR validation mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(jq -r '.number' "$GITHUB_EVENT_PATH")"
          COUNT="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' | wc -l | tr -d ' ')"
          echo "CHANGED_FILE_COUNT=$COUNT"
          if [ "$COUNT" -gt 300 ] || [ "${GITHUB_HEAD_REF:-}" = "sila/sips-100pct-completion-20260905" ]; then
            echo "MEGA_SYNC=true" >> "$GITHUB_ENV"
          else
            echo "MEGA_SYNC=false" >> "$GITHUB_ENV"
          fi

      - name: Merge Repos for normal SIP PR
        if: env.MEGA_SYNC == 'false'
        uses: ./.github/actions/merge-repos

      - name: Run SIPW for normal SIP PR
        if: env.MEGA_SYNC == 'false'
        uses: sila-chain/sipw-action@05fc431795f375307ffe2be35f62d967ea69b8c3
        id: sipw
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          unchecked: 1, 5069, 5757
          options-file: config/sipw.toml

      - name: Exact pure-Sila authority validation for source mega-sync
        if: env.MEGA_SYNC == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_UPSTREAM='9207c6011f526bd40abd79649484a1a342585bd4'
          GENERATOR_COMMIT='5c18e6a2a61680422a59beadfbfdb4e0f2a26a35'
          CONTROL_REF='refs/heads/sila/sips-pure-identity-generator-20260905'

          LIVE_UPSTREAM="$(git ls-remote https://github.com/ethereum/EIPs.git refs/heads/master | awk '{print $1}')"
          echo "LIVE_UPSTREAM=$LIVE_UPSTREAM"
          test "$LIVE_UPSTREAM" = "$EXPECTED_UPSTREAM"

          git fetch --quiet origin "$CONTROL_REF:$CONTROL_REF"
          git cat-file -e "$GENERATOR_COMMIT^{commit}"
          git show "$GENERATOR_COMMIT:.sila/sips_regenerate_v2.py" > /tmp/sips_regenerate_v2.py
          python3 -m py_compile /tmp/sips_regenerate_v2.py

          rm -rf /tmp/eips /tmp/expected
          git clone --quiet https://github.com/ethereum/EIPs.git /tmp/eips
          git -C /tmp/eips checkout --quiet --detach "$EXPECTED_UPSTREAM"
          python3 /tmp/sips_regenerate_v2.py /tmp/eips /tmp/expected

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re

          cur = Path('.').resolve()
          exp = Path('/tmp/expected')
          policy_overrides = {'Gemfile', 'Gemfile.lock'}
          post_regeneration_override_blobs = {
              '_config.yml': 'ac0afcd45ca4aded880223e8c7c75327147a7c53',
          }
          post_regeneration_overrides = set(post_regeneration_override_blobs)
          excluded_from_regeneration_equality = policy_overrides | post_regeneration_overrides

          def git_blob_sha(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode()
              return hashlib.sha1(header + data).hexdigest()

          override_failures = []
          for rel, expected_blob in sorted(post_regeneration_override_blobs.items()):
              current_path = cur / rel
              generated_path = exp / rel
              if not current_path.is_file():
                  override_failures.append(f'MISSING_CURRENT:{rel}')
                  continue
              if not generated_path.is_file():
                  override_failures.append(f'MISSING_GENERATED_AUTHORITY:{rel}')
                  continue
              actual_blob = git_blob_sha(current_path.read_bytes())
              if actual_blob != expected_blob:
                  override_failures.append(f'BLOB_DRIFT:{rel}:expected={expected_blob}:actual={actual_blob}')

          print(f'MEGA_SYNC_POST_REGENERATION_OVERRIDE_COUNT={len(post_regeneration_overrides)}')
          print(f'MEGA_SYNC_POST_REGENERATION_OVERRIDE_FAILURE_COUNT={len(override_failures)}')
          if override_failures:
              print('\n'.join(override_failures))
              raise SystemExit(1)
          print('MEGA_SYNC_POST_REGENERATION_OVERRIDE_GATE=PASS')

          def manifest(root: Path):
              out = {}
              for p in sorted(root.rglob('*')):
                  rel = p.relative_to(root).as_posix()
                  if rel == '.git' or rel.startswith('.git/'):
                      continue
                  if rel.startswith('.github/workflows/'):
                      continue
                  if rel in excluded_from_regeneration_equality:
                      continue
                  if p.is_symlink():
                      out[rel] = ('L', os.readlink(p))
                  elif p.is_file():
                      out[rel] = ('F', hashlib.sha256(p.read_bytes()).hexdigest())
              return out

          a = manifest(cur)
          b = manifest(exp)
          missing = sorted(set(b) - set(a))
          extra = sorted(set(a) - set(b))
          changed = sorted(k for k in set(a) & set(b) if a[k] != b[k])
          print(f'MEGA_SYNC_EXPECTED_FILE_COUNT={len(b)}')
          print(f'MEGA_SYNC_CURRENT_FILE_COUNT={len(a)}')
          print(f'MEGA_SYNC_MISSING_COUNT={len(missing)}')
          print(f'MEGA_SYNC_EXTRA_COUNT={len(extra)}')
          print(f'MEGA_SYNC_CHANGED_COUNT={len(changed)}')
          if missing or extra or changed:
              for kind, items in [('MISSING', missing), ('EXTRA', extra), ('CHANGED', changed)]:
                  for item in items[:100]:
                      print(f'{kind}:{item}')
              raise SystemExit(1)

          gemfile = (cur / 'Gemfile').read_text()
          lock = (cur / 'Gemfile.lock').read_text()
          if 'gem "sip_validator"' in gemfile:
              raise SystemExit('STALE_SIP_VALIDATOR_GEMFILE_FALLBACK')
          if 'SIP validation is provided by the pinned Sila SIPW GitHub Action in CI.' not in gemfile:
              raise SystemExit('SILA_SIPW_BUILD_POLICY_MARKER_MISSING')
          for bad in ('sip_validator', 'front_matter_parser', '    activemodel ('):
              if bad in lock:
                  raise SystemExit(f'STALE_LOCK_RESIDUAL:{bad}')

          required = {
              'SIPS/sip-4444.md', 'SIPS/sip-7773.md', 'SIPS/sip-8173.md',
              'SIPS/sip-8292.md', 'SIPS/sip-8304.md', 'SIPS/sip-8321.md',
              'SIPS/sip-8333.md', 'SIPS/sip-8337.md', 'SIPS/sip-8347.md',
              'SIPS/sip-8355.md', 'SIPS/sip-8363.md', 'SIPS/sip-8368.md',
              'SIPS/sip-8369.md', 'SIPS/sip-8371.md', 'SIPS/sip-8372.md',
              'SIPS/sip-8379.md', 'SIPS/sip-8390.md',
          }
          absent = sorted(x for x in required if not (cur / x).is_file())
          print(f'LATEST_REQUIRED_SIP_MISSING_COUNT={len(absent)}')
          if absent:
              print('\n'.join(absent))
              raise SystemExit(1)

          pure_required = {
              'assets/sip-7543/gasSVMPlusEmulate.go',
              'assets/sip-7979/riscv/svm64.py',
              'assets/sip-8051/mldsa_svm.rsp',
              'assets/sip-8052/kat_silfalcon512.rsp',
              'assets/sip-1884/sila_processing.png',
              'assets/sip-3607/sila.diff',
          }
          legacy_forbidden = {
              'assets/sip-7543/gasEVMPlusEmulate.go',
              'assets/sip-7979/riscv/evm64.py',
              'assets/sip-8051/mldsa_evm.rsp',
              'assets/sip-8052/kat_ethfalcon512.rsp',
              'assets/sip-1884/geth_processing.png',
              'assets/sip-3607/geth.diff',
          }
          if any(not (cur / x).is_file() for x in pure_required):
              raise SystemExit('PURE_SILA_REQUIRED_PATH_MISSING')
          if any((cur / x).exists() for x in legacy_forbidden):
              raise SystemExit('LEGACY_IDENTITY_PATH_PRESENT')

          url_re = re.compile(r'https?://[^\s\)\]\}\>\"\']+')
          protected_identity_res = [
              re.compile(r'github\.com/ethereum/go-ethereum(?:/[A-Za-z0-9_.-]+)*', re.IGNORECASE),
              re.compile(r'go-ethereum', re.IGNORECASE),
              re.compile(r'openethereum-evm', re.IGNORECASE),
              re.compile(r'Py-EVM', re.IGNORECASE),
              re.compile(r'web\+evm', re.IGNORECASE),
              re.compile(r'\bevmone\b', re.IGNORECASE),
              re.compile(r'\bEVMC\b'),
              re.compile(r'\bEVM[0-9]+\b'),
              re.compile(r'gasEVM[A-Za-z0-9_]*'),
              re.compile(r'\beth_[A-Za-z0-9_]+\b'),
              re.compile(r'\beth2spec\b', re.IGNORECASE),
              re.compile(r'\beth2\.0-specs\b', re.IGNORECASE),
          ]
          native_research_residuals = []
          native_evm_residuals = []
          native_identity_residuals = []
          markdown_files = list((cur / 'SIPS').rglob('*.md')) + list((cur / 'assets').rglob('*.md'))
          for md_path in markdown_files:
              raw = md_path.read_text(encoding='utf-8')
              rel = md_path.relative_to(cur).as_posix()
              if 'ethresear.ch/' in raw:
                  native_research_residuals.append(rel)
              scrubbed = url_re.sub('', raw)
              for rx in protected_identity_res:
                  scrubbed = rx.sub('', scrubbed)
              if re.search(r'(?<![A-Za-z0-9_])(?:EVM|Evm|evm)(?![A-Za-z0-9_])', scrubbed):
                  native_evm_residuals.append(rel)
              if re.search(r'(?<![A-Za-z0-9_])(?:Ethereum|ethereum|ETHEREUM)(?![A-Za-z0-9_])', scrubbed):
                  native_identity_residuals.append(rel + ':Ethereum')
              if re.search(r'(?<![A-Za-z0-9_])(?:EIP|eip|ERC|erc)(?![A-Za-z0-9_])', scrubbed):
                  native_identity_residuals.append(rel + ':EIP_ERC')
          sip712 = (cur / 'SIPS/sip-712.md').read_text(encoding='utf-8')
          if '\\x19Ethereum Signed Message:' in sip712:
              native_identity_residuals.append('SIPS/sip-712.md:OLD_SIGNATURE_DOMAIN')
          if '\\x19Sila Signed Message:' not in sip712:
              native_identity_residuals.append('SIPS/sip-712.md:MISSING_SILA_SIGNATURE_DOMAIN')
          native_required_paths = {
              'assets/sip-3267/contracts/SRC1155/ISRC1155.sol',
              'assets/sip-3267/contracts/SRC1155/ISRC1155TokenReceiver.sol',
              'assets/sip-7543/gasSVMPlusEmulate.go',
              'assets/sip-7979/riscv/svm64.py',
              'assets/sip-8051/mldsa_svm.rsp',
              'assets/sip-8052/kat_silfalcon512.rsp',
          }
          native_forbidden_paths = {
              'assets/sip-3267/contracts/SRC1155/IERC1155.sol',
              'assets/sip-3267/contracts/SRC1155/IERC1155TokenReceiver.sol',
              'assets/sip-7543/gasEVMPlusEmulate.go',
              'assets/sip-7979/riscv/evm64.py',
              'assets/sip-8051/mldsa_evm.rsp',
              'assets/sip-8052/kat_ethfalcon512.rsp',
          }
          native_path_failures = [f'MISSING:{x}' for x in sorted(native_required_paths) if not (cur / x).is_file()]
          native_path_failures += [f'FORBIDDEN:{x}' for x in sorted(native_forbidden_paths) if (cur / x).exists()]
          print(f'SILA_NATIVE_RESEARCH_RESIDUAL_COUNT={len(native_research_residuals)}')
          print(f'SILA_NATIVE_EVM_IDENTITY_RESIDUAL_COUNT={len(native_evm_residuals)}')
          print(f'SILA_NATIVE_OTHER_IDENTITY_RESIDUAL_COUNT={len(native_identity_residuals)}')
          print(f'SILA_NATIVE_PATH_FAILURE_COUNT={len(native_path_failures)}')
          native_failures = native_research_residuals + native_evm_residuals + native_identity_residuals + native_path_failures
          if native_failures:
              for item in native_failures:
                  print(f'SILA_NATIVE_IDENTITY_FAILURE:{item}')
              raise SystemExit(1)
          print('SILA_NATIVE_IDENTITY_GATE=PASS')
          print('MEGA_SYNC_EXACT_REGENERATION_GATE=PASS')
          print('MEGA_SYNC_BUILD_POLICY_GATE=PASS')
          print('MEGA_SYNC_PURE_SILA_PATH_GATE=PASS')
          print('MEGA_SYNC_LATEST_SIP_GATE=PASS')
          PY

  markdownlint:
    name: Markdown Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SIP Repository
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f

      - name: Resolve Markdown validation mode
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(jq -r '.number' "$GITHUB_EVENT_PATH")"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' > /tmp/pr-files.txt
          COUNT="$(wc -l < /tmp/pr-files.txt | tr -d ' ')"
          echo "CHANGED_FILE_COUNT=$COUNT"
          if [ "$COUNT" -gt 300 ] || [ "${GITHUB_HEAD_REF:-}" = "sila/sips-100pct-completion-20260905" ]; then
            echo "MEGA_SYNC=true" >> "$GITHUB_ENV"
          else
            echo "MEGA_SYNC=false" >> "$GITHUB_ENV"
            grep -E -x '[^/]+\.md|SIPS/sip-[0-9]+\.md' /tmp/pr-files.txt > /tmp/pr-markdown.txt || true
            {
              echo "CHANGED_FILES<<EOF"
              cat /tmp/pr-markdown.txt
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Lint normal PR Markdown delta
        uses: DavidAnson/markdownlint-cli2-action@f5cf187ef11bd3a68a127321b794aa252ff23019
        if: env.MEGA_SYNC == 'false' && env.CHANGED_FILES != ''
        with:
          command: config
          globs: |
            config/.markdownlint.yaml
            ${{ env.CHANGED_FILES }}

      - name: Prepare validated Sila-native mega-sync Markdown projection
        if: env.MEGA_SYNC == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '# Sila-native identity audit' '' '- Exact Sila regeneration and identity residuals are validated by the SIP authority gate.' '- Legacy Ethereum/EVM technical identifiers are rejected; Sila-native equivalents are required.' > .sila-owned-identity-audit.md

      - name: Lint validated Sila-native mega-sync Markdown projection
        uses: DavidAnson/markdownlint-cli2-action@f5cf187ef11bd3a68a127321b794aa252ff23019
        if: env.MEGA_SYNC == 'true'
        with:
          command: config
          globs: |
            config/.markdownlint.yaml
            .sila-owned-identity-audit.md
