name: Sila Identity Finalizer

on:
  push:
    branches:
      - sila/sips-100pct-completion-20260905

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f
        with:
          fetch-depth: 0
          ref: sila/sips-100pct-completion-20260905

      - name: Apply Sila-native identity policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('SIPS'), Path('assets')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(p for p in root.rglob('*.md') if p.is_file())
          for p in (Path('README.md'), Path('CONTRIBUTING.md')):
              if p.is_file():
                  files.append(p)

          url_re = re.compile(r'https?://[^\s\)\]\}\>\"\']+')
          protected_res = [
              re.compile(r'Py-EVM', re.IGNORECASE),
              re.compile(r'openethereum-evm', re.IGNORECASE),
              re.compile(r'web\+evm', re.IGNORECASE),
              re.compile(r'\bevmone\b', re.IGNORECASE),
              re.compile(r'\bEVMC\b'),
              re.compile(r'\bEVM[0-9]+\b'),
              re.compile(r'gasEVM[A-Za-z0-9_]*'),
          ]

          def mask(text, regexes, prefix):
              saved = []
              for rx in regexes:
                  def repl(m):
                      token = f'__{prefix}_{len(saved):06d}__'
                      saved.append(m.group(0))
                      return token
                  text = rx.sub(repl, text)
              return text, saved

          def restore(text, saved, prefix):
              for i, value in enumerate(saved):
                  text = text.replace(f'__{prefix}_{i:06d}__', value)
              return text

          def transform(text):
              # Sila is independent: historical research URLs are not carried as Sila identity.
              text = re.sub(r'(?m)^discussions-to:\s*https?://ethresear\.ch/\S+\s*\n', '', text)
              text = re.sub(r'\[([^\]]+)\]\(https?://ethresear\.ch/[^\)]+\)', r'\1', text)

              text, urls = mask(text, [url_re], 'SILA_URL')
              text, protected = mask(text, protected_res, 'SILA_EVM_PROTECTED')

              # EVM as protocol identity belongs to Sila as SVM, including phrases such as
              # EVM-compatible and ZK-EVM. Only explicit third-party/dense identifiers above survive.
              text = re.sub(r'(?<![A-Za-z0-9_])EVM(?![A-Za-z0-9_])', 'SVM', text)
              text = re.sub(r'(?<![A-Za-z0-9_])Evm(?![A-Za-z0-9_])', 'Svm', text)
              text = re.sub(r'(?<![A-Za-z0-9_])evm(?![A-Za-z0-9_])', 'svm', text)

              text = restore(text, protected, 'SILA_EVM_PROTECTED')
              text = restore(text, urls, 'SILA_URL')
              return text

          changed = []
          for p in sorted(set(files)):
              original = p.read_text(encoding='utf-8')
              converted = transform(original)
              if converted != original:
                  p.write_text(converted, encoding='utf-8')
                  changed.append(p.as_posix())

          # Fail if an Ethereum Research URL remains in Sila proposal/documentation Markdown.
          research_residuals = []
          evm_residuals = []
          for p in sorted(set(files)):
              text = p.read_text(encoding='utf-8')
              if 'ethresear.ch/' in text:
                  research_residuals.append(p.as_posix())

              scrubbed = url_re.sub('', text)
              for rx in protected_res:
                  scrubbed = rx.sub('', scrubbed)
              if re.search(r'(?<![A-Za-z0-9_])(?:EVM|Evm|evm)(?![A-Za-z0-9_])', scrubbed):
                  evm_residuals.append(p.as_posix())

          print(f'SILA_IDENTITY_CHANGED_FILE_COUNT={len(changed)}')
          for rel in changed:
              print(f'SILA_IDENTITY_CHANGED:{rel}')
          print(f'ETH_RESEARCH_RESIDUAL_FILE_COUNT={len(research_residuals)}')
          print(f'ACTIONABLE_EVM_IDENTITY_RESIDUAL_FILE_COUNT={len(evm_residuals)}')
          if research_residuals or evm_residuals:
              for rel in research_residuals:
                  print(f'ETH_RESEARCH_RESIDUAL:{rel}')
              for rel in evm_residuals:
                  print(f'ACTIONABLE_EVM_IDENTITY_RESIDUAL:{rel}')
              raise SystemExit(1)
          print('SILA_NATIVE_IDENTITY_GATE=PASS')
          PY

      - name: Commit finalized identity and remove temporary workflow
        shell: bash
        env:
          BRANCH: sila/sips-100pct-completion-20260905
        run: |
          set -euo pipefail
          rm -f .github/workflows/sila-identity-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- . ':!.github/workflows/sila-identity-finalize.yml' && git diff --quiet -- .github/workflows/sila-identity-finalize.yml; then
            echo 'NO_IDENTITY_CHANGES=1'
            exit 0
          fi
          git add -u
          git commit -m 'identity: enforce Sila-native SVM references'
          git push origin "HEAD:$BRANCH"
