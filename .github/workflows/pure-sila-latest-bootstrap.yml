name: Pure Sila Latest Bootstrap

on:
  push:
    branches:
      - sila/sips-pure-identity-latest-20260907

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sila/sips-pure-identity-latest-20260907
          fetch-depth: 0

      - name: Regenerate latest pure Sila content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil, subprocess

          EXPECTED='a9031bdc85949321a9707dd59ba44cdcba4a0eb0'
          GENERATOR='921b038391116fd2f65650b198b504e952067301'
          BRANCH='sila/sips-pure-identity-latest-20260907'
          SOURCE='https://github.com/ethereum/EIPs.git'

          def run(*args, cwd=None, capture=False):
              cp = subprocess.run(args, cwd=cwd, check=True, text=True,
                                  stdout=subprocess.PIPE if capture else None)
              return cp.stdout if capture else None

          live = run('git','ls-remote',SOURCE,'refs/heads/master',capture=True).split()[0]
          print(f'LIVE_SOURCE={live}')
          if live != EXPECTED:
              raise SystemExit(f'UPSTREAM_MOVED:{live}')

          run('git','fetch','--quiet','origin','refs/heads/sila/sips-pure-identity-generator-20260905:refs/remotes/origin/sila/sips-pure-identity-generator-20260905')
          run('git','cat-file','-e',f'{GENERATOR}^{{commit}}')
          generator = run('git','show',f'{GENERATOR}:.sila/sips_regenerate_v2.py',capture=True)
          Path('/tmp/generator.py').write_text(generator,encoding='utf-8')
          run('python3','-m','py_compile','/tmp/generator.py')

          for p in ('/tmp/source','/tmp/generated','/tmp/policy'):
              shutil.rmtree(p,ignore_errors=True)
          run('git','clone','--quiet',SOURCE,'/tmp/source')
          run('git','checkout','--quiet','--detach',EXPECTED,cwd='/tmp/source')
          run('python3','/tmp/generator.py','/tmp/source','/tmp/generated')

          policy=Path('/tmp/policy')
          policy.mkdir()
          shutil.copytree('.github/workflows',policy/'workflows')
          for f in ('Gemfile','Gemfile.lock','_config.yml'):
              shutil.copy2(f,policy/f)

          root=Path('.')
          for child in list(root.iterdir()):
              if child.name == '.git':
                  continue
              if child.is_dir() and not child.is_symlink():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          for src in Path('/tmp/generated').iterdir():
              dst=root/src.name
              if src.is_dir() and not src.is_symlink():
                  shutil.copytree(src,dst,symlinks=True)
              elif src.is_symlink():
                  os.symlink(os.readlink(src),dst)
              else:
                  shutil.copy2(src,dst)

          shutil.rmtree('.github/workflows',ignore_errors=True)
          Path('.github').mkdir(exist_ok=True)
          shutil.copytree(policy/'workflows','.github/workflows')
          for f in ('Gemfile','Gemfile.lock','_config.yml'):
              shutil.copy2(policy/f,f)

          required=[
              'assets/sip-7543/gasSVMPlusEmulate.go',
              'assets/sip-7979/riscv/svm64.py',
              'assets/sip-8051/mldsa_svm.rsp',
              'assets/sip-8052/kat_silfalcon512.rsp',
          ]
          for rel in required:
              if not Path(rel).is_file():
                  raise SystemExit(f'REQUIRED_SILA_PATH_MISSING:{rel}')

          run('git','config','user.name','SILA Network')
          run('git','config','user.email','pssd500@gmail.com')
          run('git','add','-A')
          status=run('git','status','--porcelain=v1',capture=True)
          if not status.strip():
              raise SystemExit('NO_REGENERATION_DELTA')
          run('git','commit','-m','regenerate: sync latest upstream with absolute Sila-native identity')
          run('git','push','origin',f'HEAD:{BRANCH}')
          PY
