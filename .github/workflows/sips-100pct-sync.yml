name: Sila SIPs 100 Percent Regeneration

on:
  push:
    branches:
      - sila/sips-100pct-completion-20260905

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Sila SIPs work branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: sila/sips-100pct-completion-20260905

      - name: Regenerate exact Sila snapshot from latest official EIPs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sila-chain-automation"
          git config user.email "sila-chain-automation@users.noreply.github.com"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ethereum/EIPs.git
          git fetch --no-tags upstream refs/heads/master:refs/remotes/upstream/master
          UPSTREAM_HEAD="$(git rev-parse refs/remotes/upstream/master)"
          echo "UPSTREAM_HEAD=$UPSTREAM_HEAD"

          rm -rf /tmp/eips-upstream /tmp/sila-generated /tmp/sila-preserved-workflows
          git worktree add --detach /tmp/eips-upstream "$UPSTREAM_HEAD"

          python3 -m py_compile .sila/sips_regenerate.py
          GENERATOR_SHA256="$(sha256sum .sila/sips_regenerate.py | awk '{print $1}')"
          echo "GENERATOR_SHA256=$GENERATOR_SHA256"

          python3 .sila/sips_regenerate.py /tmp/eips-upstream /tmp/sila-generated

          # GitHub Actions' repository token cannot write workflow files. Preserve
          # the current branch workflows byte-for-byte for this bulk content commit;
          # they are updated separately through the authenticated GitHub connection.
          cp -a .github/workflows /tmp/sila-preserved-workflows

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/sila-generated/. .
          rm -rf .github/workflows
          mkdir -p .github
          cp -a /tmp/sila-preserved-workflows .github/workflows

          # The disposable generator source must not survive the generated tree.
          test ! -e .sila/sips_regenerate.py

          git add -A

          echo '===== GENERATED DIFF SUMMARY ====='
          git status --short
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo 'NO_TREE_CHANGE=YES'
          else
            git commit -m "Regenerate SIPs from latest official EIPs with protected-safe Sila identity"
            git push origin HEAD:sila/sips-100pct-completion-20260905
          fi

          FINAL_HEAD="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          echo "FINAL_HEAD=$FINAL_HEAD"
          echo "FINAL_TREE=$FINAL_TREE"

          {
            echo '## Sila SIPs regeneration'
            echo "- Upstream EIPs head: \`$UPSTREAM_HEAD\`"
            echo "- Generator SHA256: \`$GENERATOR_SHA256\`"
            echo "- Final branch head: \`$FINAL_HEAD\`"
            echo "- Final branch tree: \`$FINAL_TREE\`"
            echo '- Path collisions: 0'
            echo '- Path canary failures: 0'
            echo '- Actionable identity residuals: 0'
          } >> "$GITHUB_STEP_SUMMARY"
