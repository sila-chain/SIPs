name: Merge ERCs

runs:
  using: 'composite'
  steps:
    - name: Checkout ERCs
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: sila/ERCs
        path: ERCs
    - name: Merge Repos
      shell: bash
      run: |
        mkdir -p $GITHUB_WORKSPACE/ERCs/ERCS
        mkdir -p $GITHUB_WORKSPACE/ERCs/SIPS
        cp -rp $GITHUB_WORKSPACE/ERCs/ERCS/. $GITHUB_WORKSPACE/SIPS
        cp -rp $GITHUB_WORKSPACE/ERCs/SIPS/. $GITHUB_WORKSPACE/SIPS
        cp -rp $GITHUB_WORKSPACE/ERCs/assets/. $GITHUB_WORKSPACE/assets
        cd $GITHUB_WORKSPACE/SIPS
        find . -name "erc-*.md" -type f -exec sh -c 'echo mv "$1" "$(echo "$1" | sed s/erc/sip/)"' _ {} \; | sh
        cd $GITHUB_WORKSPACE/assets
        find . -depth -name "erc-*" -type d -exec sh -c 'echo mv "$1" "$(echo "$1" | sed s/erc/sip/)"' _ {} \; | sh
        cd $GITHUB_WORKSPACE
        rm -rf ERCs
